[project]
name = "inference-lab"
version = "0.1.0"
description = "Which hardware and runtime should serve the cheap, high-volume step of an AI agent?"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "boto3>=1.35",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "moto[server]>=5.1"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
